name: Release

# 构建链复用 build.py:本地与 CI 走同一条 do_build 路径(PyInstaller -> Payload
# -> 右键菜单组件 -> Inno Setup),避免两套构建逻辑漂移。
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # 手动触发:只构建+传 artifact,不发布,用于首次调试

permissions:
  contents: write # GITHUB_TOKEN 需要创建 Release 的权限

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # runner 控制台是 cp1252,中文日志会 UnicodeEncodeError;
      # UTF-8 模式会被 build.py/build_menu.py/PyInstaller 等所有 Python 子进程继承
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        # 与 build.py 的 PIP_INSTALL_LINE 保持一致
        run: >-
          python -m pip install --upgrade pip
          pyinstaller pywebview pystray Pillow requests pefile
          yara-python numpy onnxruntime

      - name: Install Inno Setup
        # 安装到 Program Files (x86)\Inno Setup 6,命中 build.py 的 INNO_COMMON_PATHS
        run: choco install innosetup -y --no-progress

      - name: Verify tag matches PYAS_Version.py
        # build.py 会以 v{VERSION} 为准创建 Release,tag 不一致会在远端多造出一个
        # 指向默认分支的旧版本 tag,所以在这里快速失败
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $expected = "v" + (Select-String -Path PYAS_Version.py -Pattern '^VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ("${{ github.ref_name }}" -ne $expected) {
            Write-Error "Tag ${{ github.ref_name }} 与 PYAS_Version.py 的 $expected 不一致,请先更新版本号或改打 tag"
            exit 1
          }

      - name: Build installer
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          # 发布包必须是普通模式:不带上游跟进检查等开发用能力
          python build.py local --channel normal 2>&1 | Tee-Object -FilePath build_output.log
          exit $LASTEXITCODE

      - name: Write build tail to job summary
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build_output.log) {
            "## Build failure (last 60 lines)" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            '```text' | Out-File -Append $env:GITHUB_STEP_SUMMARY
            Get-Content build_output.log -Tail 60 -Encoding utf8 | Out-File -Append $env:GITHUB_STEP_SUMMARY
            '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PYAS_Setup_${{ github.ref_name }}
          path: Output/PYAS_Setup_v*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --skip-build:上一步已构建,这里只做 gh release create + 上传
        run: python build.py release --skip-build
