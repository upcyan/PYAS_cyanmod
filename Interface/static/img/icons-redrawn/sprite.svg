<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!--
    PYAS Cyanmod · 界面图标重绘稿

    网格 24x24 / 描边 2 / 圆帽圆角 / 2px 安全边距 / currentColor 自动跟随主题

    【锐利度铁律】描边 2(偶数) 必须配整数坐标 —— 但只对「正交图元」生效:
      · 整数坐标 → 描边覆盖 [x-1, x+1],边缘正好压在像素边界上 → 目视锐利清晰
      · x.5 坐标 → 描边覆盖 [x-0.5, x+1.5],正好骑在像素中点 → 抗锯齿发虚
      · 约束对象:rect 的 x/y/w/h、circle 的 cx/cy/r、水平或垂直线段。
        斜线与曲线本身就是抗锯齿边缘,取整没有意义,因此不受此约束
        (i-gear 的齿尖坐标带小数即属此类,不是违规)。
      · 此前为消除"撑破边距"而加的 scale() 等比缩放会把整数坐标乘成小数
        (齿轮 61 处、垃圾桶 35 处…),已全部移除。
    【视觉尺寸统一】几何最大维一律 ≤18(含描边后视觉框 20),与线上原版观感一致。
      天然偏小的例外:close 14x14、chevron-right/left 6x12、chevron-down 12x6、
      minimize 14x1(单横线)、key 18x10、terminal 18x12。
      另有例外:盾族(i-shield / shield-check / shield-pulse / shield-bot / shield-wifi)
      保持线上原版盾形 16x20(x4~20 / y2~22) —— 用户明确偏好原版盾,且族内必须同尺寸。
      i-spinner 是独立档(viewBox 0 0 50 50),描边 4 与 24 格的 2 是同一比例
      (4/50=8% vs 2/24=8.33%),不是例外,只是不走 --icon-stroke。
    命名: i-<语义>; 同族共享词根(shield-*, monitor-*, chevron-*)

    【实装方式】本文件是唯一源文件,整份内联进 index.html / threat.html 的 <body> 开头
      (display:none),界面各处用 <use> 引用 #i-<语义> 形式的 id。选内联而非外部引用,
      是因为外部 svg 在 file:// 下会被 CORS 拦掉。改动本文件后需同步重新内联,
      tests/test_icons_installed.py 会逐字节比对,漏同步会直接测红。
    【描边取值】symbol 上写 stroke-width="var(--icon-stroke, 2)":
      外层 CSS 选不中 use 的 shadow 内容,只能靠自定义属性把描边传进去。
      默认 2;列表图标上下文(style.css 的 .item-icon)给 1.5,保持线上原有观感。
    【未纳入重绘】关于按钮的信息圆、進程管理的显示器+心电 —— 本集没有对应图元,
      在 index.html 里保持内联原几何(见该文件内注释)。
  -->

  <!-- 窗口控制 -->
  <symbol id="i-minimize" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke, 2)" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></symbol>
  <symbol id="i-maximize" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke, 2)" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/></symbol>
  <symbol id="i-restore" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke, 2)" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h10a2 2 0 0 1 2 2v10"/><path d="M13 3h-8a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke, 2)" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5 19 19M19 5 5 19"/></symbol>

  <!-- 侧栏导航 -->
  <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke, 2)" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8"/><path d="M5 10v11h14V10"/><path d="M9 21v-6h6v6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke, 2)" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M17 17 21 21"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke, 2)" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke, 2)" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></symbol>
  <symbol id="i-terminal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke, 2)" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6 10 12 3 18"/><path d="M12 18h9"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke, 2)" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M21 12 18 14.5 18.4 18.4 14.5 18 12 21 9.5 18 5.6 18.4 6 14.5 3 12 6 9.5 5.6 5.6 9.5 6 12 3 14.5 6 18.4 5.6 18 9.5Z"/></symbol>

  <!-- 首页 -->
  <symbol id="i-shield-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke, 2)" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="i-scan-smart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke, 2)" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M16 16 20 20"/><path d="m7 11 3 3 5-5"/></symbol>
  <symbol id="i-archive" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke, 2)" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M12 12v5M9 14l3 3 3-3"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke, 2)" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10a9 9 0 1 0-2 8M21 4v6h-6"/></symbol>
  <symbol id="i-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke, 2)" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></symbol>
  <symbol id="i-chevron-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke, 2)" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></symbol>

  <!-- 防护引擎 -->
  <symbol id="i-shield-pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke, 2)" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M8 12h2l1-3 2 6 1-3h2"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke, 2)" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8v8M14 8v8"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke, 2)" stroke-linecap="round" stroke-linejoin="round"><path d="m12 4 9 4-9 4-9-4 9-4Z"/><path d="m3 12 9 4 9-4"/><path d="m3 16 9 4 9-4"/></symbol>
  <symbol id="i-file-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke, 2)" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="m8 14 3 3 5-6"/></symbol>
  <symbol id="i-monitor-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke, 2)" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M9 20h6M12 16v4"/><path d="m8 10 3 3 5-5"/></symbol>
  <symbol id="i-shield-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke, 2)" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M8 10a6 6 0 0 1 8 0"/><path d="M10 13a3 3 0 0 1 4 0"/><circle cx="12" cy="16" r="0.5"/></symbol>
  <symbol id="i-cpu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke, 2)" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/><path d="m8 12 3 3 5-6"/></symbol>
  <symbol id="i-custom-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke, 2)" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M8 10h8M8 15h5"/></symbol>

  <!-- 工具 -->
  <symbol id="i-plug" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke, 2)" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="4"/><path d="M6 7h12v4a6 6 0 0 1-6 6 6 6 0 0 1-6-6V7zM12 17v4"/></symbol>
  <symbol id="i-power" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke, 2)" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10"/><path d="M6 6a8 8 0 1 0 12 0"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke, 2)" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18"/><path d="M9 7V4h6v3"/><path d="M5 7v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7"/><path d="M10 11v6M14 11v6"/></symbol>
  <!-- 扳手:斜置图元,坐标为小数(见文件头「锐利度铁律」的适用范围)。几何 18x18 -->
  <symbol id="i-wrench" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke, 2)" stroke-linecap="round" stroke-linejoin="round"><path d="M17.2 3.2a6.1 6.1 0 0 0-7.3 7.3l-6.1 6.1a2.4 2.4 0 0 0 3.7 3.7l6.1-6.1a6.1 6.1 0 0 0 7.3-7.3l-3.7 3.7-3.7-3.7 3.7-3.7Z"/></symbol>
  <symbol id="i-window-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke, 2)" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 8h18m-12 3 6 6m0-6-6 6"/></symbol>
  <symbol id="i-activity" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke, 2)" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 15 3-4 3 3 5-7"/></symbol>
  <symbol id="i-clipboard-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke, 2)" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="17" rx="2"/><rect x="9" y="3" width="6" height="4" rx="2"/><path d="m8 13 3 3 5-5"/></symbol>

  <!-- 设置 · 引擎 -->
