    PYAS Cyanmod · 界面图标重绘稿

    网格 24x24 / 描边 2 / 圆帽圆角 / 2px 安全边距 / currentColor 自动跟随主题

    【锐利度铁律】描边 2(偶数) 必须配整数坐标 —— 但只对「正交图元」生效:
      · 整数坐标 → 描边覆盖 [x-1, x+1],边缘正好压在像素边界上 → 目视锐利清晰
      · x.5 坐标 → 描边覆盖 [x-0.5, x+1.5],正好骑在像素中点 → 抗锯齿发虚
      · 约束对象:rect 的 x/y/w/h、circle 的 cx/cy/r、水平或垂直线段。
        斜线与曲线本身就是抗锯齿边缘,取整没有意义,因此不受此约束
        (i-gear 的齿尖坐标带小数即属此类,不是违规)。
      · 此前为消除"撑破边距"而加的 scale() 等比缩放会把整数坐标乘成小数
        (齿轮 61 处、垃圾桶 35 处…),已全部移除。
    【视觉尺寸统一】几何最大维一律 ≤18(含描边后视觉框 20),与线上原版观感一致。
      天然偏小的例外:close 14x14、chevron-right/left 6x12、chevron-down 12x6、
      minimize 14x1(单横线)、key 18x10、terminal 18x12。
      另有例外:盾族(i-shield / shield-check / shield-pulse / shield-bot / shield-wifi)
      保持线上原版盾形 16x20(x4~20 / y2~22) —— 用户明确偏好原版盾,且族内必须同尺寸。
      i-spinner 是独立档(viewBox 0 0 50 50),描边 4 与 24 格的 2 是同一比例
      (4/50=8% vs 2/24=8.33%),不是例外,只是不走 --icon-stroke。
    命名: i-<语义>; 同族共享词根(shield-*, monitor-*, chevron-*)

    【实装方式】本文件是唯一源文件,整份内联进 index.html / threat.html 的 <body> 开头
      (display:none),界面各处用 <use> 引用 #i-<语义> 形式的 id。选内联而非外部引用,
      是因为外部 svg 在 file:// 下会被 CORS 拦掉。改动本文件后需同步重新内联,
      tests/test_icons_installed.py 会逐字节比对,漏同步会直接测红。
    【描边取值】symbol 上写 stroke-width="var(--icon-stroke, 2)":
      外层 CSS 选不中 use 的 shadow 内容,只能靠自定义属性把描边传进去。
      默认 2;列表图标上下文(style.css 的 .item-icon)给 1.5,保持线上原有观感。
    【未纳入重绘】关于按钮的信息圆、進程管理的显示器+心电 —— 本集没有对应图元,
      在 index.html 里保持内联原几何(见该文件内注释)。
  -->

  <symbol id="i-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke, 2)" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-6l-2-2H5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2Z"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke, 2)" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></symbol>
  <symbol id="i-spinner" viewBox="0 0 50 50"><circle cx="25" cy="25" r="20" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><animate attributeName="stroke-dasharray" values="1,150;90,150;90,150" dur="1.5s" repeatCount="indefinite"/><animate attributeName="stroke-dashoffset" values="0;-35;-124" dur="1.5s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="rotate" values="0 25 25;360 25 25" dur="2s" repeatCount="indefinite"/></circle></symbol>
</svg>

    <div id="ai_window_glow" class="ai-window-glow" aria-hidden="true"></div>
    <div class="app-container">
        <header class="navigate-window pywebview-drag-region">
            <div class="navigate-title">PYAS Security Cyanmod</div>
            <!-- 待处理数量紧跟标题:一行读完,不用扫到右边找 -->
            <span class="queue-chip">
                <h2 id="queue_heading" class="queue-chip-label">Pending alerts</h2>
                <b id="queue_count" class="queue-chip-count" aria-live="polite">0</b>
            </span>
            <div class="window-controls">
                <button class="ctrl-btn" id="threat_close" aria-label="Close" title="Close">
                    <svg class="theme-svg"><use href="#i-close"/></svg>
                </button>
            </div>
        </header>
        <main class="threat-layout">
            <!-- 队列明细不再展示(逐条 FIFO 处理,数量已在标题栏);
                 列表节点保留,threat.js 仍按原样渲染,便于回归与将来恢复 -->
            <aside class="threat-queue" aria-labelledby="queue_heading" hidden>
                <ol id="threat_queue_list"></ol>
            </aside>
            <section class="threat-detail" aria-labelledby="threat_title">
                <div class="threat-summary">
                    <svg class="theme-svg" aria-hidden="true" focusable="false"><use href="#i-shield-pulse"/></svg>
                    <div><h1 id="threat_title">Loading…</h1><p id="threat_context" class="threat-context"></p></div>
                </div>
                <section id="threat_evidence" class="detection-card" aria-labelledby="evidence_heading">
                    <div class="detection-head">
                        <h2 id="evidence_heading">Detection evidence</h2>
                        <div class="detection-score"><span id="evidence_score_label">Threat score</span><strong id="threat_score">—</strong><span id="threat_score_scale" hidden>/100</span></div>
                    </div>
                    <p id="threat_score_note" class="evidence-note"></p>
                    <div id="threat_score_track" class="score-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" hidden><div id="threat_score_fill"></div></div>
                    <dl class="detection-grid">
                        <div><dt id="evidence_category_label">Category</dt><dd id="threat_category" class="is-empty" data-label="">—</dd></div>
                        <div><dt id="evidence_engine_label">Detection engine</dt><dd id="threat_engine" class="is-empty" data-label="">—</dd></div>
                        <div><dt id="evidence_platform_label">Platform</dt><dd id="threat_platform" class="is-empty" data-label="">—</dd></div>
                        <div><dt id="evidence_family_label">Family</dt><dd id="threat_family" class="is-empty" data-label="">—</dd></div>
                    </dl>

                    <div id="threat_rules_row" class="detection-rules" hidden><span id="evidence_rules_label">Matched rules</span><code id="threat_rules" dir="ltr"></code></div>
                    <!-- 规则描述是规则作者写的英文原文:标出来,别让它看起来像漏翻 -->
                    <div id="threat_rule_description_wrap" class="rule-description" hidden>
                        <span id="threat_rule_description_label" class="rule-description-label"></span>
                        <p id="threat_rule_description" class="evidence-note"></p>
                    </div>

                </section>
                <section id="threat_file" class="threat-file hidden" aria-labelledby="evidence_file_label">
                    <div class="file-heading">
                        <span id="evidence_file_label">File</span>
                        <span class="file-heading-value">
                            <strong id="threat_file_name"></strong>
                            <button class="file-open-btn" id="threat_file_open" type="button" aria-label="Open containing folder" title="Open containing folder">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-folder"/></svg>
                            </button>
                        </span>
                    </div>
                    <!-- 完整路径只在悬停时提示,正文不再占一行 -->
                    <p id="threat_file_path" class="file-path" dir="ltr" hidden></p>
                    <!-- 顺序:文件 → 它的哈希 → 目标 → 操作进程(先说完文件,再说去哪、谁操作) -->
                    <div class="file-hash"><span id="evidence_hash_label">SHA-256</span><code id="threat_file_hash" dir="ltr">—</code></div>
                    <div class="file-target hidden" id="threat_target_row"><span id="evidence_target_label">Target</span><code id="threat_target" dir="ltr"></code></div>
                    <p id="threat_process" class="threat-process hidden"></p>
                </section>
                <!-- 事件详情独立成块:驱动/进程告警没有文件,但事件描述必须能显示 -->
                <!-- 默认收起:原始文本通常比结构化字段长得多,展开会把操作区顶出视野 -->
                <details id="threat_event_details" class="event-details">
                    <summary id="evidence_event_label">Event and file identity</summary>
                    <div id="threat_message" class="threat-message" tabindex="0"></div>
                </details>
                <div id="ai_result" class="ai-result hidden" role="status" aria-live="polite">
                    <div class="ai-result-head">
                        <svg aria-hidden="true" focusable="false"><use href="#i-sparkles"/></svg>
                        <span class="ai-result-title" id="ai_result_title"></span>
                        <span class="ai-result-verdict" id="ai_result_verdict"></span>
                        <span id="ai_result_note" class="ai-result-note"></span>
                    </div>
                    <p class="ai-result-reason" id="ai_result_reason"></p>

                </div>

            </section>
        </main>
        <footer class="threat-footer">
            <p id="threat_status" class="threat-status" role="status"></p>
            <div id="threat_confirmation" class="hidden" role="group" aria-labelledby="threat_confirmation_text">
                <p id="threat_confirmation_text"></p>
                <button id="threat_confirm" class="action-btn modern-btn" type="button">Confirm</button>
                <button id="threat_cancel" class="action-btn modern-btn" type="button">Cancel</button>
            </div>
            <div id="threat_fp_panel" class="hidden" role="group" aria-labelledby="threat_fp_title">
                <p id="threat_fp_title"></p>
                <p id="threat_fp_identity" class="fp-identity"></p>
                <div class="fp-scope">
                    <label><input type="radio" name="fp_scope" id="threat_fp_scope_this" value="file_rule" checked><span id="threat_fp_scope_this_text"></span></label>
                    <label><input type="radio" name="fp_scope" id="threat_fp_scope_file" value="file"><span id="threat_fp_scope_file_text"></span></label>
                    <label id="threat_fp_scope_signer_wrap" hidden><input type="radio" name="fp_scope" id="threat_fp_scope_signer" value="signer"><span id="threat_fp_scope_signer_text"></span></label>
                </div>
                <div class="fp-row">
                    <label id="threat_fp_reason_label" for="threat_fp_reason"></label>
                    <select id="threat_fp_reason" class="modern-select"></select>
                </div>
                <input type="text" id="threat_fp_note" class="fp-note" maxlength="200" spellcheck="false">
                <div class="fp-actions">
                    <button id="threat_fp_submit" class="action-btn modern-btn primary-btn" type="button"></button>
                    <button id="threat_fp_cancel" class="action-btn modern-btn" type="button"></button>
                </div>
            </div>
            <!-- 重复提示放在页脚(固定区):内容再长也不会滚走或被遮挡 -->
            <p id="threat_repeat_hint" class="threat-repeat-hint hidden" role="note"></p>
            <!-- 决策行:左边三档「记住多久」,右边两个动作。
                 动作文案随档位变化(永久允许 / 临时允许(60 秒) / 本次允许)。 -->
            <div class="threat-decide">
                <div class="decide-modes" role="radiogroup" aria-label="Remember">
                    <label class="decide-mode"><input type="radio" name="decision_mode" value="permanent"><span id="mode_permanent_text"></span></label>
                    <label class="decide-mode"><input type="radio" name="decision_mode" value="temp"><span id="mode_temp_text"></span></label>
                    <label class="decide-mode"><input type="radio" name="decision_mode" value="once" checked><span id="mode_once_text"></span></label>
                </div>
                <div class="decide-actions">
                    <button id="threat_allow" class="action-btn modern-btn allow-btn" type="button" disabled>Allow</button>
                    <button id="threat_block" class="action-btn modern-btn block-btn" type="button" disabled>Block</button>
                </div>
            </div>
            <button id="threat_fp" class="fp-link" type="button" hidden></button>
        </footer>
    </div>
</body>
</html>
